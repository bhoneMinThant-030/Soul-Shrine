<!doctype html>
<!--
  ============================================================
  Shell only. Each track renders its own markup into its own
  mount point from its own JS file — there is no track-specific
  HTML here.

  Nav is responsive: a sidebar on desktop, a bottom bar on
  phones. Both carry class="tab" so app.js (and any track that
  wants to switch screens) can treat them identically.
  ============================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fourward — study well, think well</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/reframe.css">
  <link rel="stylesheet" href="css/focus.css">
  <link rel="stylesheet" href="css/social.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

<div class="shell">

  <!-- ---------- desktop sidebar ---------- -->
  <aside class="sidenav">
    <div class="sidenav-brand">Fourward</div>

    <nav class="sidenav-list" role="tablist" aria-label="Main sections">
      <button class="tab nav-item" role="tab" data-screen="home" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </button>
      <button class="tab nav-item" role="tab" data-screen="reframe" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9c0 1.6.42 3.1 1.15 4.4L3 21l4.7-1.1A9 9 0 1 0 12 3zm0 4a1 1 0 0 1 1 1v4a1 1 0 0 1-2 0V8a1 1 0 0 1 1-1zm0 8.5a1.15 1.15 0 1 1 0 2.3 1.15 1.15 0 0 1 0-2.3z"/></svg>
        <span>Advice</span>
      </button>
      <button class="tab nav-item" role="tab" data-screen="focus" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 10a1 1 0 0 1-.4.8l-3.5 2.6a1 1 0 0 1-1.2-1.6L11 11.5V6a1 1 0 0 1 2 0z"/></svg>
        <span>Focus</span>
      </button>
      <button class="tab nav-item" role="tab" data-screen="social" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm7 1a3 3 0 1 0-3-3 3 3 0 0 0 3 3zM9 13c-3.3 0-7 1.7-7 4.5V20h14v-2.5C16 14.7 12.3 13 9 13zm7 .5c-.6 0-1.2 0-1.7.2A6 6 0 0 1 18 17.5V20h4v-2.3c0-2.4-3-4.2-6-4.2z"/></svg>
        <span>Together</span>
      </button>
      <button class="tab nav-item" role="tab" data-screen="profile" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-8 2-8 5.2V21h16v-1.8c0-3.2-4-5.2-8-5.2z"/></svg>
        <span>Profile</span>
      </button>
    </nav>

    <div class="sidenav-foot">
      <span class="sidenav-orb" aria-hidden="true"></span>
      <span class="sidenav-who" id="who"></span>
    </div>
  </aside>

  <!-- ---------- content column ---------- -->
  <div class="content">

    <header class="topbar">
      <div class="profile-orb" aria-hidden="true"></div>
      <div class="brand-name">Fourward</div>
      <button class="icon-btn" id="notifications" aria-label="Notifications" title="Notifications">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-5-1.5-2v-4a5.5 5.5 0 0 0-4-5.3V5a1.5 1.5 0 0 0-3 0v.7A5.5 5.5 0 0 0 6.5 11v4L5 17v1h14z"/></svg>
      </button>
    </header>

    <main id="main">
      <section id="home-root"    class="screen" role="tabpanel" aria-label="Home"></section>
      <!-- Track B (cognitive / camera)  -->
      <section id="focus-root"   class="screen" role="tabpanel" aria-label="Focus" hidden></section>
      <!-- Track A (psychological / AI) -->
      <section id="reframe-root" class="screen" role="tabpanel" aria-label="Advice" hidden></section>
      <!-- Track C (social)             -->
      <section id="social-root"  class="screen" role="tabpanel" aria-label="Together" hidden></section>
      <section id="profile-root" class="screen" role="tabpanel" aria-label="Profile" hidden></section>
    </main>

  </div>
</div>

<!-- ---------- phone bottom bar ---------- -->
<nav class="bottom-nav" role="tablist" aria-label="Primary navigation">
  <button class="tab bottom-tab is-active" role="tab" data-screen="home" aria-label="Home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
  </button>
  <button class="tab bottom-tab" role="tab" data-screen="reframe" aria-label="Advice">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9c0 1.6.42 3.1 1.15 4.4L3 21l4.7-1.1A9 9 0 1 0 12 3zm0 4a1 1 0 0 1 1 1v4a1 1 0 0 1-2 0V8a1 1 0 0 1 1-1zm0 8.5a1.15 1.15 0 1 1 0 2.3 1.15 1.15 0 0 1 0-2.3z"/></svg>
  </button>
  <button class="tab bottom-tab" role="tab" data-screen="focus" aria-label="Focus">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 10a1 1 0 0 1-.4.8l-3.5 2.6a1 1 0 0 1-1.2-1.6L11 11.5V6a1 1 0 0 1 2 0z"/></svg>
  </button>
  <button class="tab bottom-tab" role="tab" data-screen="social" aria-label="Together">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm7 1a3 3 0 1 0-3-3 3 3 0 0 0 3 3zM9 13c-3.3 0-7 1.7-7 4.5V20h14v-2.5C16 14.7 12.3 13 9 13zm7 .5c-.6 0-1.2 0-1.7.2A6 6 0 0 1 18 17.5V20h4v-2.3c0-2.4-3-4.2-6-4.2z"/></svg>
  </button>
  <button class="tab bottom-tab" role="tab" data-screen="profile" aria-label="Profile">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-8 2-8 5.2V21h16v-1.8c0-3.2-4-5.2-8-5.2z"/></svg>
  </button>
</nav>

<!-- Screen-reader announcements. Any track may call announce() from app.js. -->
<div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
